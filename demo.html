<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>旅行乌鸦 · 预览</title><style>body{font:15px system-ui;background:#242626;color:#dfdfd5;margin:0;padding:24px}h1{font-size:22px}p{line-height:1.8;color:#b6bbb3}.toolbar{display:flex;flex-wrap:wrap;gap:8px}button,select{font:inherit;padding:10px;border:1px solid #818b7a;background:#394136;color:#e6e9df;border-radius:9px}.chat{padding:16px;background:#30332f;border-radius:12px;margin-top:20px;max-width:560px}.note{font-size:12px;color:#85917c}</style><h1>旅行乌鸦</h1><p>本页模拟酒馆事件，点右侧鸟窝体验。<br>真实安装后，由角色回复推动旅行。</p><div class="toolbar"><button id="next">模拟一轮聊天</button><button id="duplicate">重复同一回复</button><select id="char"><option value="0">温柔的旅行者</option><option value="1">寡言的学者</option></select></div><div class="chat" id="chat">它刚刚住进鸟窝。</div><p class="note">这是独立预览。人设读取返回模拟结果，不连接模型。<br>各角色状态会保存在这个浏览器中。</p><div id="extensions_settings2"></div><script type="module">
import {KEY,DEFAULT_PROFILE} from './engine.js';
const events={};let index=0;
const types=Object.fromEntries(['APP_READY','CHAT_CHANGED','GENERATION_STARTED','GENERATION_STOPPED','GENERATION_ENDED','MESSAGE_RECEIVED','CHARACTER_MESSAGE_RENDERED','CHARACTER_EDITED'].map(x=>[x,x]));
const chats=[[],[]],metadata=[{},{}];
const saved=JSON.parse(localStorage.getItem('raven-demo')||'{}');
const c={extensionSettings:saved,characters:[{avatar:'traveler.png',name:'温柔的旅行者',data:{personality:'温柔勇敢，热爱冒险和自然，很亲近你。'}},{avatar:'scholar.png',name:'寡言的学者',data:{personality:'冷淡寡言的学者，好奇爱研究书本，宅在家里。'}}],characterId:0,chat:chats[0],chatMetadata:metadata[0],onlineStatus:'connected',eventTypes:types,eventSource:{on:(t,f)=>{(events[t]??=[]).push(f);if(t==='APP_READY')f();}},saveSettingsDebounced:()=>localStorage.setItem('raven-demo',JSON.stringify(c.extensionSettings)),saveMetadata:async()=>{},generateQuietPrompt:async()=>JSON.stringify({...DEFAULT_PROFILE,summary:'这是预览中的模拟人设。',source:'模型读取',adventure:.85,affection:.9})};
globalThis.SillyTavern={getContext:()=>c};
const emit=(t,...args)=>(events[t]||[]).forEach(f=>f(...args));
document.querySelector('#next').onclick=()=>{emit('GENERATION_STARTED','normal');c.chat.push({is_user:true,send_date:Date.now(),mes:'你好'});c.chat.push({mes:'今天也一起度过吧。'});emit('MESSAGE_RECEIVED',c.chat.length-1);emit('CHARACTER_MESSAGE_RENDERED',c.chat.length-1);emit('GENERATION_ENDED');document.querySelector('#chat').textContent='又聊完了一轮，小乌鸦的日子前进了一点。';};
document.querySelector('#duplicate').onclick=()=>{emit('CHARACTER_MESSAGE_RENDERED',c.chat.length-1);document.querySelector('#chat').textContent='重复回复事件：乌鸦不会重复推进。';};
document.querySelector('#char').onchange=e=>{index=Number(e.target.value);c.characterId=index;c.chat=chats[index];c.chatMetadata=metadata[index];emit('CHAT_CHANGED');};
await import('./index.js');
</script></html>
